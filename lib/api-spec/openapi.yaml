openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI integration
  - name: anthropic
    description: Customer-facing Anthropic assistant
  - name: portal
    description: Customer portal and office inbox
  - name: catalog
    description: Published service prices and requirements
  - name: billing
    description: Invoices and online payment
  - name: reminders
    description: Document expiry reminders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/extract-transaction:
    post:
      operationId: extractTransaction
      tags: [openai]
      summary: Extract transaction details from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTransactionRequest"
      responses:
        "200":
          description: Extracted data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedTransaction"
        "400":
          description: Invalid request
        "403":
          description: Origin is not allowed
        "413":
          description: Request body is too large
        "429":
          description: Too many requests
        "502":
          description: AI response could not be validated or the service failed
  /anthropic/answer-inquiry:
    post:
      operationId: answerCustomerInquiry
      tags: [anthropic]
      summary: Answer a signed-in customer's general service question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAIQuestion"
      responses:
        "200":
          description: Advisory answer from the assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAIAnswer"
        "400":
          description: Invalid question
        "401":
          description: Authentication required
        "429":
          description: Rate limit reached
        "502":
          description: Assistant temporarily unavailable
  /office/approved-information:
    get:
      operationId: listApprovedInformation
      tags: [portal]
      summary: Staff-only knowledge drafts and publication history
      responses:
        "200":
          description: Office information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedInformation"
    post:
      operationId: createApprovedInformation
      tags: [portal]
      summary: Create an unpublished draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedInformationInput"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedInformation"
  /office/approved-information/{id}:
    patch:
      operationId: updateApprovedInformation
      tags: [portal]
      summary: Edit draft without changing the published version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedInformationUpdate"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedInformation"
        "404":
          description: Information not found
        "409":
          description: Information changed since it was loaded
  /office/approved-information/{id}/history:
    get:
      operationId: listApprovedInformationHistory
      tags: [portal]
      summary: Staff-only publication and withdrawal history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Past publication events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedInformationHistory"
        "404":
          description: Information not found
  /office/approved-information/{id}/review:
    post:
      operationId: reviewApprovedInformation
      tags: [portal]
      summary: Mark the current draft as reviewed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedInformationMutation"
      responses:
        "200":
          description: Reviewed draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedInformation"
        "404":
          description: Information not found
        "409":
          description: Information changed since it was loaded
  /office/approved-information/{id}/publish:
    post:
      operationId: publishApprovedInformation
      tags: [portal]
      summary: Publish the reviewed draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedInformationMutation"
      responses:
        "200":
          description: Published information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedInformation"
        "409":
          description: Information changed or draft has not been reviewed
  /office/approved-information/{id}/unpublish:
    post:
      operationId: unpublishApprovedInformation
      tags: [portal]
      summary: Withdraw information from the assistant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedInformationMutation"
      responses:
        "200":
          description: Withdrawn information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedInformation"
        "404":
          description: Information not found
        "409":
          description: Information changed since it was loaded
  /portal/me:
    get:
      operationId: getPortalMe
      tags: [portal]
      summary: Get the signed-in user's portal role and registration status
      responses:
        "200":
          description: Current role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUser"
        "401":
          description: Authentication required
  /portal/registration:
    get:
      operationId: getPortalRegistration
      tags: [portal]
      summary: Get the signed-in user's customer registration request
      responses:
        "200":
          description: Current registration request, or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRegistrationResult"
        "401":
          description: Authentication required
    post:
      operationId: submitPortalRegistration
      tags: [portal]
      summary: Submit or resubmit a customer registration request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequestInput"
      responses:
        "201":
          description: Registration request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRegistration"
        "400":
          description: Invalid registration details or email is not verified
        "401":
          description: Authentication required
        "409":
          description: A pending request exists or the account is already approved
  /portal/summary:
    get:
      operationId: getPortalSummary
      tags: [portal]
      summary: Customer dashboard with recent activity
      responses:
        "200":
          description: Customer summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSummary"
        "401":
          description: Authentication required
        "403":
          description: Customer registration approval required
  /service-requests:
    get:
      operationId: listServiceRequests
      tags: [portal]
      summary: List the signed-in customer's service requests
      responses:
        "200":
          description: Customer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"
    post:
      operationId: createServiceRequest
      tags: [portal]
      summary: Submit a service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Customer registration approval required
  /service-requests/attachments/upload-url:
    post:
      operationId: requestServiceAttachmentUpload
      tags: [portal]
      summary: Reserve a private upload for an approved customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadInput"
      responses:
        "200":
          description: Temporary direct upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadReservation"
        "400":
          description: Invalid file
  /service-requests/{id}/attachments:
    post:
      operationId: attachServiceRequestFiles
      tags: [portal]
      summary: Attach uploaded files (reserved with the upload-url endpoint) to an existing request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachAttachmentsInput"
      responses:
        "200":
          description: The request with its attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Invalid, expired or incomplete upload
        "404":
          description: Not found
        "409":
          description: The request is completed or already has 10 attachments
  /service-requests/attachments/{attachmentId}:
    delete:
      operationId: deleteServiceRequestFile
      tags: [portal]
      summary: Remove an attachment from a request
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
        "409":
          description: The attachment can no longer be removed
  /service-requests/attachments/{attachmentId}/download:
    get:
      operationId: downloadServiceAttachment
      tags: [portal]
      summary: Download a submitted attachment owned by the customer
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found or not owned
  /office/service-requests/attachments/upload-url:
    post:
      operationId: requestOfficeServiceAttachmentUpload
      tags: [portal]
      summary: Reserve a private upload for office staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadInput"
      responses:
        "200":
          description: Temporary direct upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadReservation"
        "400":
          description: Invalid file
  /office/service-requests/{id}/attachments:
    post:
      operationId: attachOfficeServiceRequestFiles
      tags: [portal]
      summary: Attach uploaded files (reserved with the upload-url endpoint) to an existing request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachAttachmentsInput"
      responses:
        "200":
          description: The request with its attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeServiceRequest"
        "400":
          description: Invalid, expired or incomplete upload
        "404":
          description: Not found
        "409":
          description: The request already has 10 attachments
  /office/service-requests/attachments/{attachmentId}:
    delete:
      operationId: deleteOfficeServiceRequestFile
      tags: [portal]
      summary: Remove an attachment from a request
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
        "409":
          description: The attachment can no longer be removed
  /office/service-requests/attachments/{attachmentId}/download:
    get:
      operationId: downloadOfficeServiceAttachment
      tags: [portal]
      summary: Authorized staff download of a submitted attachment
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Office access required
  /service-requests/{id}:
    get:
      operationId: getServiceRequest
      tags: [portal]
      summary: Get a request owned by the signed-in customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "404":
          description: Not found
        "401":
          description: Authentication required
        "403":
          description: Customer registration approval required
  /service-requests/{id}/history:
    get:
      operationId: getServiceRequestHistory
      tags: [portal]
      summary: Status changes of a request owned by the signed-in customer, oldest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequestStatusEvent"
        "404":
          description: Not found
        "401":
          description: Authentication required
        "403":
          description: Customer registration approval required
  /inquiries:
    get:
      operationId: listInquiries
      tags: [portal]
      summary: List the signed-in customer's inquiries (including older unlinked inquiries)
      responses:
        "200":
          description: Inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"
    post:
      operationId: createInquiry
      tags: [portal]
      summary: Send an inquiry to the office
      description: An optional linked service request must belong to the signed-in customer. Unknown and other-customer request IDs receive the same error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "400":
          description: Invalid inquiry or linked service request
        "401":
          description: Authentication required
        "403":
          description: Customer registration approval required
  /office/summary:
    get:
      operationId: getOfficeSummary
      tags: [portal]
      summary: Staff-only intake overview
      responses:
        "200":
          description: Office summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeSummary"
        "403":
          description: Office access required
  /office/service-requests:
    get:
      operationId: listOfficeServiceRequests
      tags: [portal]
      summary: Staff-only paginated customer requests
      parameters:
        - { name: page, in: query, description: "1-based page; defaults to 1", schema: { type: integer, minimum: 1, maximum: 1000000 } }
        - { name: pageSize, in: query, description: "Defaults to 20; capped at 100", schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Case-insensitive literal substring of reference, service, description or contact phone", schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [received, reviewing, waiting_on_customer, submitted_to_authority, awaiting_payment, completed] } }
        - { name: category, in: query, schema: { type: string, enum: [passports, labor, business, other] } }
        - { name: sort, in: query, description: "Newest created first, oldest updated first, or soonest due date first; ID breaks ties", schema: { type: string, enum: [newest, oldest_update, due_soon] } }
        - { name: assignee, in: query, description: "me, unassigned, or an office member's user ID", schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: overdue, in: query, description: "Only open requests past their due date", schema: { type: boolean } }
      responses:
        "200":
          description: Matching page and total count across all matching records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeServiceRequestPage"
        "400":
          description: Invalid pagination or filter
        "401":
          description: Authentication required
        "403":
          description: Office access required
  /office/registrations:
    get:
      operationId: listOfficeRegistrations
      tags: [portal]
      summary: Staff-only list of customer registration requests
      responses:
        "200":
          description: Registration requests with verified applicant email only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeRegistration"
        "401":
          description: Authentication required
        "403":
          description: Office access required
  /office/registrations/{id}:
    patch:
      operationId: reviewOfficeRegistration
      tags: [portal]
      summary: Staff-only approval or rejection of a pending registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationReview"
      responses:
        "200":
          description: Reviewed registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeRegistration"
        "400":
          description: Invalid review
        "401":
          description: Authentication required
        "403":
          description: Office access required
        "404":
          description: Registration request not found
        "409":
          description: Registration request is no longer pending
  /office/service-requests/{id}:
    patch:
      operationId: updateOfficeServiceRequest
      tags: [portal]
      summary: Staff-only update of request progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeServiceRequest"
        "404":
          description: Request not found
        "409":
          description: Request changed since it was loaded
  /office/inquiries:
    get:
      operationId: listOfficeInquiries
      tags: [portal]
      summary: Staff-only paginated customer inquiries
      parameters:
        - { name: page, in: query, description: "1-based page; defaults to 1", schema: { type: integer, minimum: 1, maximum: 1000000 } }
        - { name: pageSize, in: query, description: "Defaults to 20; capped at 100", schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Case-insensitive literal substring of subject, message or linked request reference", schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [open, answered] } }
      responses:
        "200":
          description: Matching page and total count across all matching records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeInquiryPage"
        "400":
          description: Invalid pagination or filter
        "401":
          description: Authentication required
        "403":
          description: Office access required
  /office/inquiries/{id}:
    patch:
      operationId: answerOfficeInquiry
      tags: [portal]
      summary: Staff-only answer to an inquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryAnswer"
      responses:
        "200":
          description: Answered inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeInquiry"
  /office/legacy/preview:
    post:
      operationId: previewLegacyBackup
      tags: [portal]
      summary: Validate and preview a plain v1 mobile backup (office only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyBackupInput"
      responses:
        "200":
          description: Validated backup metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyBackupSummary"
  /office/legacy/import:
    post:
      operationId: importLegacyBackup
      tags: [portal]
      summary: Import a reviewed plain v1 mobile backup (office only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyImportInput"
      responses:
        "201":
          description: Stored import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyImportSummary"
  /office/legacy/imports:
    get:
      operationId: listLegacyImports
      tags: [portal]
      summary: List imported mobile backups (office only)
      responses:
        "200":
          description: Imported backups and stored record identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyImportSummary"
  /office/staff:
    get:
      operationId: listOfficeStaff
      tags: [portal]
      summary: List office staff (owner only)
      responses:
        "200":
          description: Office staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeStaffMember"
        "401":
          description: Authentication required
        "403":
          description: Office owner access required
    post:
      operationId: addOfficeStaff
      tags: [portal]
      summary: Give office access to an existing account by its verified email (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeStaffInput"
      responses:
        "201":
          description: Added staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeStaffMember"
        "400":
          description: Invalid email
        "401":
          description: Authentication required
        "403":
          description: Office owner access required
        "404":
          description: No account has this email verified
        "409":
          description: The account already has office access
  /office/staff/{userId}:
    delete:
      operationId: removeOfficeStaff
      tags: [portal]
      summary: Remove a staff member's office access (owner only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "204":
          description: Access removed
        "400":
          description: The owner account cannot be removed
        "401":
          description: Authentication required
        "403":
          description: Office owner access required
        "404":
          description: Staff member not found
  /office/audit-log:
    get:
      operationId: listOfficeAuditLog
      tags: [portal]
      summary: Latest office staff access changes, newest first (owner only)
      responses:
        "200":
          description: Up to 200 most recent audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "401":
          description: Authentication required
        "403":
          description: Office owner access required
  /service-offers:
    get:
      operationId: listServiceOffers
      tags: [catalog]
      summary: Published prices, processing times and required documents for catalogue services
      description: Public. Only offers the office owner has published are returned.
      responses:
        "200":
          description: Published offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceOffer" }
  /office/service-offers:
    get:
      operationId: listOfficeServiceOffers
      tags: [catalog]
      summary: Owner-only list of every saved offer, published or not
      responses:
        "200":
          description: Saved offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceOffer" }
        "401": { description: Authentication required }
        "403": { description: Office owner access required }
  /office/service-offers/{slug}:
    put:
      operationId: saveOfficeServiceOffer
      tags: [catalog]
      summary: Owner-only create or replace the offer for a catalogue service
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,63}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceOfferInput" }
      responses:
        "200":
          description: Saved offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOffer" }
        "400": { description: Invalid offer }
        "401": { description: Authentication required }
        "403": { description: Office owner access required }
  /service-requests/{id}/rating:
    post:
      operationId: rateServiceRequest
      tags: [portal]
      summary: Rate a completed request owned by the signed-in customer (once)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingInput" }
      responses:
        "200":
          description: Rated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRequest" }
        "400": { description: Invalid rating }
        "404": { description: Not found }
        "409": { description: The request is not completed or is already rated }
  /service-requests/{id}/invoices:
    get:
      operationId: listServiceRequestInvoices
      tags: [billing]
      summary: Invoices on a request owned by the signed-in customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Invoices, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Not found }
  /invoices/{id}/pay:
    post:
      operationId: startInvoicePayment
      tags: [billing]
      summary: Open the payment gateway's hosted page for an unpaid invoice of the signed-in customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Address of the hosted payment page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentStart" }
        "404": { description: Not found }
        "409": { description: The invoice is not payable }
        "502": { description: Payment gateway failed }
        "503": { description: Online payment is not configured }
  /invoices/{id}/refresh:
    post:
      operationId: refreshInvoicePayment
      tags: [billing]
      summary: Re-check the payment gateway for an invoice of the signed-in customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Invoice with its current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { description: Not found }
  /office/service-requests/{id}/invoices:
    get:
      operationId: listOfficeServiceRequestInvoices
      tags: [billing]
      summary: Staff-only invoices on a request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Invoices, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
        "403": { description: Office access required }
        "404": { description: Not found }
    post:
      operationId: issueOfficeInvoice
      tags: [billing]
      summary: Staff-only issue an invoice on a request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Issued invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { description: Invalid invoice }
        "403": { description: Office access required }
        "404": { description: Not found }
  /office/invoices/{id}:
    patch:
      operationId: updateOfficeInvoice
      tags: [billing]
      summary: Staff-only record a manual payment or cancel an unpaid invoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceAction" }
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { description: Invalid action }
        "403": { description: Office access required }
        "404": { description: Not found }
        "409": { description: The invoice is no longer unpaid }
  /reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: The signed-in customer's document expiry reminders, soonest first
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reminder" }
    post:
      operationId: createReminder
      tags: [reminders]
      summary: Add a document expiry reminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderInput" }
      responses:
        "201":
          description: Saved reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400": { description: Invalid reminder }
        "409": { description: Too many reminders }
  /reminders/{id}:
    put:
      operationId: updateReminder
      tags: [reminders]
      summary: Replace one of the signed-in customer's reminders
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderInput" }
      responses:
        "200":
          description: Saved reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400": { description: Invalid reminder }
        "404": { description: Not found }
    delete:
      operationId: deleteReminder
      tags: [reminders]
      summary: Remove one of the signed-in customer's reminders
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "404": { description: Not found }
  /office/reminders:
    get:
      operationId: listOfficeReminders
      tags: [reminders]
      summary: Staff-only customer documents expiring soon, soonest first
      parameters:
        - { name: withinDays, in: query, description: "Defaults to 60", schema: { type: integer, minimum: 1, maximum: 365 } }
      responses:
        "200":
          description: Expiring documents with their customer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OfficeReminder" }
        "403": { description: Office access required }
  /office/service-requests/{id}/reminders:
    post:
      operationId: createOfficeReminder
      tags: [reminders]
      summary: Staff-only add a reminder for the customer who owns the request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderInput" }
      responses:
        "201":
          description: Saved reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400": { description: Invalid reminder }
        "403": { description: Office access required }
        "404": { description: Not found }
  /office/service-requests/attachments/{attachmentId}/extract:
    post:
      operationId: extractOfficeAttachmentDocument
      tags: [reminders]
      summary: Staff-only read an attached document's type, holder and expiry date with AI (audited)
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Suggested reminder fields, to be checked by staff before saving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractedDocument" }
        "403": { description: Office access required }
        "404": { description: Attachment not found }
        "502": { description: AI service failed or returned invalid data }
  /portal/settings:
    get:
      operationId: getPortalSettings
      tags: [portal]
      summary: The signed-in customer's notification settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSettings" }
    put:
      operationId: savePortalSettings
      tags: [portal]
      summary: Save the signed-in customer's notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalSettingsInput" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSettings" }
        "400": { description: Invalid settings }
  /office/assignees:
    get:
      operationId: listOfficeAssignees
      tags: [portal]
      summary: Staff-only list of office members a request can be assigned to
      responses:
        "200":
          description: Office members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OfficeAssignee" }
        "403": { description: Office access required }
  /office/reports:
    get:
      operationId: getOfficeReport
      tags: [portal]
      summary: Owner-only performance report for a period
      parameters:
        - { name: days, in: query, description: "Period length ending now; defaults to 30", schema: { type: integer, enum: [7, 30, 90, 365] } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeReport" }
        "403": { description: Office owner access required }
components:
  schemas:
    OfficeStaffInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    OfficeStaffMember:
      type: object
      required: [userId, email, role, addedBy, createdAt]
      properties:
        userId: { type: string }
        email: { type: ["string", "null"], format: email }
        role:
          type: string
          enum: [owner, staff]
        addedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AuditLogEntry:
      type: object
      required: [id, actorId, actorEmail, action, targetType, targetId, details, createdAt]
      properties:
        id: { type: integer }
        actorId: { type: string }
        actorEmail: { type: ["string", "null"], format: email }
        action:
          type: string
          enum: [staff.add, staff.remove, service_request.update, inquiry.answer, attachment.upload, attachment.download, attachment.delete, attachment.purge, registration.approve, registration.reject, information.review, information.publish, information.unpublish, attachment.extract, invoice.issue, invoice.mark_paid, invoice.cancel, invoice.paid_online, offer.update, reminder.create]
        targetType: { type: string }
        targetId: { type: string }
        details:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    LegacyBackupInput:
      type: object
      required: [contents]
      properties:
        contents: { type: string, minLength: 1, maxLength: 5000000 }
    LegacyImportInput:
      type: object
      required: [contents, digest, confirmed]
      properties:
        contents: { type: string, minLength: 1, maxLength: 5000000 }
        digest: { type: string, minLength: 64, maxLength: 64 }
        confirmed: { type: boolean }
    LegacyCounts:
      type: object
      required: [transactions, clients, tasks, notes]
      properties:
        transactions: { type: integer }
        clients: { type: integer }
        tasks: { type: integer }
        notes: { type: integer }
    LegacyIds:
      type: object
      required: [transactions, clients, tasks, notes]
      properties:
        transactions: { type: array, items: { type: string } }
        clients: { type: array, items: { type: string } }
        tasks: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    LegacyBackupSummary:
      type: object
      required: [exportedAt, digest, counts, ids]
      properties:
        exportedAt: { type: string, format: date-time }
        digest: { type: string }
        counts: { $ref: "#/components/schemas/LegacyCounts" }
        ids: { $ref: "#/components/schemas/LegacyIds" }
    LegacyImportSummary:
      allOf:
        - $ref: "#/components/schemas/LegacyBackupSummary"
        - type: object
          required: [id, importedAt]
          properties:
            id: { type: integer }
            importedAt: { type: string, format: date-time }
    CustomerAIQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 5, maxLength: 1000 }
    CustomerAIAnswer:
      type: object
      required: [answer, sources, needsOffice]
      properties:
        answer: { type: string }
        needsOffice: { type: boolean }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ApprovedInformationSource"
    ApprovedInformationSource:
      type: object
      required: [id, title, reviewedAt, publishedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        reviewedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
    ApprovedInformationInput:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        content: { type: string, minLength: 10, maxLength: 2000 }
    ApprovedInformationUpdate:
      type: object
      additionalProperties: false
      required: [title, content, expectedUpdatedAt]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        content: { type: string, minLength: 10, maxLength: 2000 }
        expectedUpdatedAt: { type: string, format: date-time }
    ApprovedInformationMutation:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
    ApprovedInformation:
      type: object
      required: [id, title, content, publishedTitle, publishedContent, reviewedAt, publishedReviewedAt, publishedAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        publishedTitle: { type: ["string", "null"] }
        publishedContent: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        publishedReviewedAt: { type: ["string", "null"], format: date-time }
        publishedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    ApprovedInformationHistory:
      type: object
      required: [id, informationId, action, title, content, reviewedAt, publishedAt, changedAt]
      properties:
        id: { type: integer }
        informationId: { type: integer }
        action: { type: string, enum: [published, withdrawn] }
        title: { type: string }
        content: { type: string }
        reviewedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        changedAt: { type: string, format: date-time }
    PortalUser:
      type: object
      required: [role, officeRole, registrationStatus]
      properties:
        role:
          type: string
          enum: [customer, staff]
        officeRole:
          type: ["string", "null"]
          enum: [owner, staff, null]
        registrationStatus:
          type: ["string", "null"]
          enum: [pending, approved, rejected, null]
    RegistrationRequestInput:
      type: object
      additionalProperties: false
      required: [fullName, contactPhone]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        contactPhone: { type: string, minLength: 9, maxLength: 24 }
        note: { type: string, maxLength: 1000 }
    PortalRegistration:
      type: object
      required: [id, fullName, contactPhone, note, status, reason, createdAt, updatedAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        contactPhone: { type: string }
        note: { type: ["string", "null"] }
        status:
          type: string
          enum: [pending, approved, rejected]
        reason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortalRegistrationResult:
      oneOf:
        - $ref: "#/components/schemas/PortalRegistration"
        - type: "null"
    OfficeRegistration:
      allOf:
        - $ref: "#/components/schemas/PortalRegistration"
        - type: object
          required: [email, reviewerId]
          properties:
            email: { type: ["string", "null"], format: email }
            reviewerId: { type: ["string", "null"] }
    RegistrationReview:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        reason: { type: ["string", "null"], maxLength: 1000 }
    ServiceRequest:
      type: object
      required: [id, reference, category, service, description, contactPhone, status, customerMessage, clientRequestId, createdAt, updatedAt, attachments, rating, ratingComment, ratedAt]
      properties:
        id: { type: integer }
        reference: { type: string }
        category:
          type: string
          enum: [passports, labor, business, other]
        service: { type: string }
        description: { type: string }
        contactPhone: { type: string }
        status:
          type: string
          enum: [received, reviewing, waiting_on_customer, submitted_to_authority, awaiting_payment, completed]
        customerMessage: { type: ["string", "null"] }
        clientRequestId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ServiceAttachment" }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        ratingComment: { type: ["string", "null"] }
        ratedAt: { type: ["string", "null"], format: date-time }
    ServiceRequestStatusEvent:
      type: object
      required: [status, at]
      properties:
        status:
          type: string
          enum: [received, reviewing, waiting_on_customer, submitted_to_authority, awaiting_payment, completed]
        at: { type: string, format: date-time }
    OfficeCustomer:
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
    OfficeServiceRequest:
      type: object
      required: [id, reference, category, service, description, contactPhone, status, customerMessage, createdAt, updatedAt, attachments, customer, assignedTo, dueAt, rating, ratingComment, ratedAt]
      properties:
        id: { type: integer }
        reference: { type: string }
        category:
          type: string
          enum: [passports, labor, business, other]
        service: { type: string }
        description: { type: string }
        contactPhone: { type: string }
        status:
          type: string
          enum: [received, reviewing, waiting_on_customer, submitted_to_authority, awaiting_payment, completed]
        officeNote: { type: ["string", "null"] }
        customerMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ServiceAttachment" }
        customer:
          oneOf:
            - $ref: "#/components/schemas/OfficeCustomer"
            - type: "null"
        assignedTo: { type: ["string", "null"], description: "User ID of the responsible office member" }
        dueAt: { type: ["string", "null"], format: date-time }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        ratingComment: { type: ["string", "null"] }
        ratedAt: { type: ["string", "null"], format: date-time }
    OfficeServiceRequestPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OfficeServiceRequest" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    ServiceAttachment:
      type: object
      required: [id, name, contentType, size, uploadedBy, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }
        uploadedBy:
          type: string
          enum: [customer, office]
        createdAt: { type: string, format: date-time }
    AttachAttachmentsInput:
      type: object
      additionalProperties: false
      required: [attachmentIds]
      properties:
        attachmentIds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1 }
    AttachmentUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
    AttachmentUploadReservation:
      type: object
      required: [attachmentId, uploadURL]
      properties:
        attachmentId: { type: integer }
        uploadURL: { type: string }
    ServiceRequestInput:
      type: object
      required: [category, service, description, contactPhone]
      properties:
        category:
          type: string
          enum: [passports, labor, business, other]
        service: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        contactPhone: { type: string, minLength: 9, maxLength: 24 }
        clientRequestId: { type: string, format: uuid }
        attachmentIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    ServiceRequestUpdate:
      type: object
      required: [status, expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [received, reviewing, waiting_on_customer, submitted_to_authority, awaiting_payment, completed]
        officeNote: { type: ["string", "null"], maxLength: 2000 }
        customerMessage: { type: ["string", "null"], maxLength: 2000 }
        assignedTo: { type: ["string", "null"], maxLength: 120, description: "Omit to keep; null to unassign" }
        dueAt: { type: ["string", "null"], format: date-time, description: "Omit to keep; null to clear" }
    Inquiry:
      type: object
      required: [id, subject, message, status, createdAt, linkedServiceRequestReference]
      properties:
        id: { type: integer }
        subject: { type: string }
        message: { type: string }
        linkedServiceRequestReference: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, answered]
        answer: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: ["string", "null"], format: date-time }
    OfficeInquiry:
      allOf:
        - $ref: "#/components/schemas/Inquiry"
        - type: object
          required: [linkedServiceRequest, customer]
          properties:
            linkedServiceRequest:
              oneOf:
                - $ref: "#/components/schemas/LinkedServiceRequestContext"
                - type: "null"
            customer:
              oneOf:
                - $ref: "#/components/schemas/OfficeCustomer"
                - type: "null"
    OfficeInquiryPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OfficeInquiry" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    LinkedServiceRequestContext:
      type: object
      required: [reference, category, service, description, status]
      properties:
        reference: { type: string }
        category:
          type: string
          enum: [passports, labor, business, other]
        service: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [received, reviewing, waiting_on_customer, submitted_to_authority, awaiting_payment, completed]
    InquiryInput:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 3, maxLength: 160 }
        message: { type: string, minLength: 10, maxLength: 5000 }
        linkedServiceRequestId: { type: ["integer", "null"], minimum: 1 }
    InquiryAnswer:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 2, maxLength: 5000 }
    PortalSummary:
      type: object
      required: [totalRequests, activeRequests, completedRequests, openInquiries, recentRequests, recentInquiries]
      properties:
        totalRequests: { type: integer }
        activeRequests: { type: integer }
        completedRequests: { type: integer }
        openInquiries: { type: integer }
        recentRequests:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequest"
        recentInquiries:
          type: array
          items:
            $ref: "#/components/schemas/Inquiry"
    OfficeSummary:
      type: object
      required: [totalRequests, newRequests, activeRequests, staleRequests, openInquiries, myRequests, overdueRequests, expiringDocuments]
      properties:
        myRequests: { type: integer, description: "Open requests assigned to the signed-in member" }
        overdueRequests: { type: integer, description: "Open requests past their due date" }
        expiringDocuments: { type: integer, description: "Customer documents expiring in the next 30 days" }
        totalRequests: { type: integer }
        newRequests: { type: integer }
        activeRequests: { type: integer }
        staleRequests: { type: integer, description: "Active requests last updated at least 3 days ago" }
        openInquiries: { type: integer }
    ExtractTransactionRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    ExtractedTransaction:
      type: object
      additionalProperties: false
      required:
        - clientName
        - service
        - serviceFee
        - governmentFee
        - period
        - duration
        - receiptDate
        - notes
      properties:
        clientName:
          type: [string, "null"]
          maxLength: 120
        service:
          type: [string, "null"]
          maxLength: 200
        serviceFee:
          type: [number, "null"]
          minimum: 0
        governmentFee:
          type: [number, "null"]
          minimum: 0
        period:
          type: [string, "null"]
          maxLength: 100
        duration:
          type: [string, "null"]
          maxLength: 100
        receiptDate:
          type: [string, "null"]
          maxLength: 80
        notes:
          type: [string, "null"]
          maxLength: 1000
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ServiceOffer:
      type: object
      required: [slug, price, governmentFeesNote, processingDays, requiredDocuments, published, updatedAt]
      properties:
        slug: { type: string }
        price: { type: ["integer", "null"], minimum: 0, description: "Office fee in halalas before VAT; null when priced after review" }
        governmentFeesNote: { type: ["string", "null"] }
        processingDays: { type: ["integer", "null"] }
        requiredDocuments:
          type: array
          items: { type: string }
        published: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ServiceOfferInput:
      type: object
      additionalProperties: false
      required: [price, governmentFeesNote, processingDays, requiredDocuments, published]
      properties:
        price: { type: ["integer", "null"], minimum: 0, maximum: 100000000 }
        governmentFeesNote: { type: ["string", "null"], maxLength: 300 }
        processingDays: { type: ["integer", "null"], minimum: 1, maximum: 365 }
        requiredDocuments:
          type: array
          maxItems: 15
          items: { type: string, minLength: 2, maxLength: 160 }
        published: { type: boolean }
    RatingInput:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: ["string", "null"], maxLength: 1000 }
    InvoiceSeller:
      type: object
      required: [name, vatNumber]
      properties:
        name: { type: string }
        vatNumber: { type: ["string", "null"] }
    Invoice:
      type: object
      required: [id, reference, requestId, requestReference, description, amount, vatRateBasisPoints, vat, total, status, paymentMethod, paymentReference, issuedAt, paidAt, cancelledAt, canPayOnline, seller]
      properties:
        id: { type: integer }
        reference: { type: string }
        requestId: { type: integer }
        requestReference: { type: string }
        description: { type: string }
        amount: { type: integer, description: "Halalas before VAT" }
        vatRateBasisPoints: { type: integer, description: "1500 means 15%" }
        vat: { type: integer }
        total: { type: integer }
        status:
          type: string
          enum: [issued, paid, cancelled]
        paymentMethod:
          type: ["string", "null"]
          enum: [manual, online, null]
        paymentReference: { type: ["string", "null"] }
        issuedAt: { type: string, format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        cancelledAt: { type: ["string", "null"], format: date-time }
        canPayOnline: { type: boolean }
        seller: { $ref: "#/components/schemas/InvoiceSeller" }
    InvoiceInput:
      type: object
      additionalProperties: false
      required: [description, amount]
      properties:
        description: { type: string, minLength: 2, maxLength: 300 }
        amount: { type: integer, minimum: 100, maximum: 100000000, description: "Halalas before VAT" }
        markAwaitingPayment: { type: boolean, description: "Also move the request to awaiting payment" }
    InvoiceAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [mark_paid, cancel]
        paymentReference: { type: ["string", "null"], maxLength: 120 }
    PaymentStart:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ReminderKind:
      type: string
      enum: [iqama, passport, commercial_register, work_permit, other]
    ReminderInput:
      type: object
      additionalProperties: false
      required: [kind, label, expiresOn]
      properties:
        kind: { $ref: "#/components/schemas/ReminderKind" }
        label: { type: string, minLength: 2, maxLength: 120 }
        expiresOn: { type: string, format: date }
        note: { type: ["string", "null"], maxLength: 500 }
    Reminder:
      type: object
      required: [id, kind, label, expiresOn, note, addedBy, createdAt]
      properties:
        id: { type: integer }
        kind: { $ref: "#/components/schemas/ReminderKind" }
        label: { type: string }
        expiresOn: { type: string, format: date }
        note: { type: ["string", "null"] }
        addedBy:
          type: string
          enum: [customer, office]
        createdAt: { type: string, format: date-time }
    OfficeReminder:
      allOf:
        - $ref: "#/components/schemas/Reminder"
        - type: object
          required: [customer, contactPhone]
          properties:
            customer:
              oneOf:
                - $ref: "#/components/schemas/OfficeCustomer"
                - type: "null"
            contactPhone: { type: ["string", "null"] }
    ExtractedDocument:
      type: object
      required: [kind, label, expiresOn, expiresOnText, notes]
      properties:
        kind:
          oneOf:
            - $ref: "#/components/schemas/ReminderKind"
            - type: "null"
        label: { type: ["string", "null"], maxLength: 120 }
        expiresOn: { type: ["string", "null"], format: date, description: "Gregorian date, converted from Hijri if needed" }
        expiresOnText: { type: ["string", "null"], maxLength: 80, description: "The date exactly as written on the document" }
        notes: { type: ["string", "null"], maxLength: 500 }
    PortalSettings:
      type: object
      required: [whatsappOptIn, whatsappPhone, whatsappAvailable]
      properties:
        whatsappOptIn: { type: boolean }
        whatsappPhone: { type: ["string", "null"] }
        whatsappAvailable: { type: boolean, description: "Whether the office has WhatsApp messages turned on" }
    PortalSettingsInput:
      type: object
      additionalProperties: false
      required: [whatsappOptIn, whatsappPhone]
      properties:
        whatsappOptIn: { type: boolean }
        whatsappPhone: { type: ["string", "null"], maxLength: 24 }
    OfficeAssignee:
      type: object
      required: [userId, email, role]
      properties:
        userId: { type: string }
        email: { type: ["string", "null"] }
        role:
          type: string
          enum: [owner, staff]
    ReportCount:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    ReportService:
      type: object
      required: [service, created, completed]
      properties:
        service: { type: string }
        created: { type: integer }
        completed: { type: integer }
    ReportStaff:
      type: object
      required: [userId, email, active, completed, overdue]
      properties:
        userId: { type: ["string", "null"], description: "Null for unassigned requests" }
        email: { type: ["string", "null"] }
        active: { type: integer }
        completed: { type: integer }
        overdue: { type: integer }
    OfficeReport:
      type: object
      required: [days, created, completed, averageCompletionDays, byStatus, byCategory, topServices, staff, ratings, revenue]
      properties:
        days: { type: integer }
        created: { type: integer }
        completed: { type: integer }
        averageCompletionDays: { type: ["number", "null"] }
        byStatus:
          type: array
          items: { $ref: "#/components/schemas/ReportCount" }
        byCategory:
          type: array
          items: { $ref: "#/components/schemas/ReportCount" }
        topServices:
          type: array
          items: { $ref: "#/components/schemas/ReportService" }
        staff:
          type: array
          items: { $ref: "#/components/schemas/ReportStaff" }
        ratings:
          type: object
          required: [count, average, distribution]
          properties:
            count: { type: integer }
            average: { type: ["number", "null"] }
            distribution:
              type: array
              items: { $ref: "#/components/schemas/ReportCount" }
        revenue:
          type: object
          required: [paidTotal, paidVat, paidCount, outstandingTotal, outstandingCount]
          properties:
            paidTotal: { type: integer }
            paidVat: { type: integer }
            paidCount: { type: integer }
            outstandingTotal: { type: integer }
            outstandingCount: { type: integer }
