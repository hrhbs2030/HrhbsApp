kind = "web"
previewPath = "/"
title = "HBS حلول الغد"
description = "موقع خدمات إلكتروني يتيح لعملاء مكتب حلول الغد إنشاء حساباتهم وإرسال طلبات المعاملات والاستفسارات ومتابعة حالتها."
version = "1.0.0"
id = "artifacts/hbs-solutions"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21172

[services.development]
run = "pnpm --filter @workspace/hbs-solutions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hbs-solutions", "run", "build" ]
run = "pnpm --filter @workspace/hbs-solutions run serve:production"

[services.env]
PORT = "21172"
BASE_PATH = "/"
